name: Online co-op problem
description: Joining fails, the peers desync, or the connection drops.
labels: [co-op]
body:
  - type: markdown
    attributes:
      value: |
        Both players must run builds from the same commit with the same Odin
        version (README.md, Online co-op); Linux and Windows can mix. Do not attach game
        files or builds of the port.
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD` on each machine.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version lines
      description: >-
        The first line of each log, or the output of `jade --version`, on the
        host and on the joiner (`jade: build ... net protocol ...`). The build
        IDs must match.
    validations:
      required: true
  - type: input
    id: systems
    attributes:
      label: Systems
      description: OS and CPU of the host and of the joiner.
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Same machine
        - Same LAN
        - Internet, UPnP opened the port
        - Internet, port forwarded by hand
        - Internet, not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: >-
        Where in the game it happened, and any message shown (window title,
        menu text). For a desync, the frame number the log reports.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The session logs from `port/logs/` on both machines, labelled host and joiner.
      render: text
